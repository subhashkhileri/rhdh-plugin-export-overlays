# CI Diagnose Auto-fix — automatic ci-diagnose → fix hand-off.
#
# When ci-diagnose posts (or updates) its sticky comment on a bot-authored PR
# and finds something fixable in THIS repo, this workflow hands the diagnosis to
# the fix agent by posting `/fs-fix` — as a real (machine-user) account, so the
# comment passes fullsend.yaml's `comment.user.type != 'Bot'` filter and emits a
# webhook that dispatches the fix stage.
#
# Why this can't live in post-ci-diagnose.sh: that script runs three layers deep
# inside fullsend's own (pinned, upstream) reusable workflow, whose harness env
# is a fixed set seeded upstream — there is no slot to inject a repo-custom
# secret, and every token it can see is an App token (type Bot, which the shim
# drops, and whose writes emit no webhook). A workflow in THIS repo is the only
# place `${{ secrets.FS_AUTOFIX_TOKEN }}` is reachable. See plan.md / docs.
#
# Why a non-bot token: only a real GitHub user's comment is `type: User` (passes
# the shim filter) AND emits a webhook (App/GITHUB_TOKEN writes are suppressed by
# GitHub anti-recursion). `FS_AUTOFIX_TOKEN` is a fine-grained PAT for a
# dedicated machine-user that is a write collaborator (so the dispatcher's
# `/fs-fix` collaborator-permission check authorizes it).
#
# Flow:
#   ci-diagnose agent emits `<!-- ci-diagnose-autofix-eligible: {sha,fixable} -->`
#     → post-ci-diagnose.sh upserts the sticky comment (App token, type Bot)
#       → issue_comment (created/edited) fires this workflow
#         → guards pass  → post `/fs-fix …` as the machine-user (type User)
#           → fullsend.yaml routes the comment to the fix stage
#
# Loop safety: the 2-attempt cap is enforced by counting our own marked
# `/fs-fix` comments — state no agent can write (diagnose & fix run in read-only
# sandboxes; only runner-side scripts and this workflow write to GitHub). The
# `/fs-fix` comment we post carries no diagnosis marker and is not bot-authored,
# so it cannot re-trigger this workflow.
name: CI Diagnose Auto-fix

on:
  # The ci-diagnose sticky comment is created once and edited in place on
  # re-runs; react to both. The per-SHA idempotency guard makes repeated
  # `edited` fires no-ops until a new commit changes the head SHA.
  issue_comment:
    types: [created, edited]

# Serialize per PR so a near-simultaneous created+edited pair can't double-post.
concurrency:
  group: ci-diagnose-autofix-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  handoff:
    name: Evaluate guards and hand off to fix
    runs-on: ubuntu-latest
    # Coarse gate — the authoritative checks run in the step below. Only react to
    # the ci-diagnose sticky comment (Bot-authored, carrying both diagnosis
    # markers), never to arbitrary comments. Our own `/fs-fix` comment matches
    # none of these, so no self-loop.
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.type == 'Bot'
      && contains(github.event.comment.body, '<!-- ci-diagnose -->')
      && contains(github.event.comment.body, '<!-- ci-diagnose-autofix-eligible:')
    steps:
      - name: Evaluate guards and decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # Login of the dedicated machine-user whose PAT is FS_AUTOFIX_TOKEN.
          AUTOFIX_USER: ${{ vars.FS_AUTOFIX_USER }}
          # Non-empty string form so we can gate without exposing the secret.
          TOKEN_SET: ${{ secrets.FS_AUTOFIX_TOKEN != '' && 'true' || 'false' }}
          # The PR author login (webhook form) for a coder-bot–authored PR.
          CODER_BOT_LOGIN: fullsend-ai-coder[bot]
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "fire=false" >> "${GITHUB_OUTPUT}"; exit 0; }

          # -- Feature gate: token + machine-user must be provisioned ----------
          [[ "${TOKEN_SET}" == "true" ]] || skip "FS_AUTOFIX_TOKEN not set — auto-fix disabled"
          [[ -n "${AUTOFIX_USER}" ]]      || skip "vars.FS_AUTOFIX_USER not set — auto-fix disabled"

          # -- Parse the autofix-eligibility marker ---------------------------
          MARKER=$(printf '%s' "${COMMENT_BODY}" \
            | grep -oE '<!-- ci-diagnose-autofix-eligible: .* -->' | head -1 \
            | sed -E 's/^<!-- ci-diagnose-autofix-eligible: (.*) -->$/\1/' || true)
          [[ -n "${MARKER}" ]] || skip "No autofix-eligibility marker — nothing to hand off"
          if ! printf '%s' "${MARKER}" | jq -e . >/dev/null 2>&1; then
            skip "Autofix-eligibility marker is not valid JSON"
          fi
          SHA=$(printf '%s' "${MARKER}" | jq -r '.sha // empty')
          FIXABLE_COUNT=$(printf '%s' "${MARKER}" | jq -r '(.fixable // []) | length')
          [[ -n "${SHA}" ]]            || skip "Marker has no sha"
          [[ "${FIXABLE_COUNT}" -gt 0 ]] || skip "No in-repo–fixable findings — summary only"

          # -- Guard: PR must be authored by the AI coder bot -----------------
          [[ "${PR_AUTHOR}" == "${CODER_BOT_LOGIN}" ]] \
            || skip "PR author ${PR_AUTHOR} is not the coder bot — not auto-fixing"

          # -- Guard: same-repo branch, never a fork --------------------------
          HEAD_REPO=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name // ""')
          BASE_REPO=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.base.repo.full_name // ""')
          [[ -n "${HEAD_REPO}" && "${HEAD_REPO}" == "${BASE_REPO}" ]] \
            || skip "Fork PR (head=${HEAD_REPO:-none}, base=${BASE_REPO}) — auto-fix blocked"

          # -- Fetch all PR comments once (reused by the guards below) ---------
          COMMENTS=$(mktemp)
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate > "${COMMENTS}"

          # -- Guard: manual opt-out label absent -----------------------------
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
               --jq '.[].name' 2>/dev/null | grep -qx "fullsend-no-fix"; then
            skip "fullsend-no-fix label present — auto-fix disabled for this PR"
          fi

          # -- Guard: a human has not already taken over with /fs-fix ---------
          # A /fs-fix comment (first token exactly "/fs-fix") from a real user
          # who is NOT our machine-user ⇒ a human is steering ⇒ back off.
          HUMAN=$(jq --arg u "${AUTOFIX_USER}" '
            [ .[]
              | select(.user.type != "Bot" and .user.login != $u)
              | select(.body | test("^\\s*/fs-fix(\\s|$)")) ] | length' "${COMMENTS}")
          [[ "${HUMAN}" -eq 0 ]] || skip "A human already posted /fs-fix — backing off"

          # -- Guard: idempotency per head SHA --------------------------------
          DUP=$(jq --arg u "${AUTOFIX_USER}" --arg m "<!-- ci-diagnose-autofix: ${SHA} -->" '
            [ .[] | select(.user.login == $u and (.body | contains($m))) ] | length' "${COMMENTS}")
          [[ "${DUP}" -eq 0 ]] || skip "Already handed off for ${SHA} — idempotent skip"

          # -- Guard: under the 2-attempt lifetime cap ------------------------
          N=$(jq --arg u "${AUTOFIX_USER}" '
            [ .[] | select(.user.login == $u and (.body | contains("<!-- ci-diagnose-autofix:"))) ] | length' "${COMMENTS}")
          if [[ "${N}" -ge 2 ]]; then
            # Post the "budget exhausted" note once (marker-idempotent).
            EXH=$(jq '[ .[] | select(.body | contains("<!-- ci-diagnose-autofix-exhausted -->")) ] | length' "${COMMENTS}")
            if [[ "${EXH}" -eq 0 ]]; then
              echo "exhausted=true" >> "${GITHUB_OUTPUT}"
            fi
            skip "Auto-fix budget exhausted (${N} attempts) — a human can take over with /fs-fix"
          fi

          # -- Clear to hand off ----------------------------------------------
          BULLETS=$(printf '%s' "${MARKER}" | jq -r '.fixable[] | "- `" + . + "`"')
          {
            echo "fire=true"
            echo "sha=${SHA}"
            echo "attempt=$((N + 1))"
            DELIM="BULLETS_$(openssl rand -hex 8)"
            echo "bullets<<${DELIM}"
            printf '%s\n' "${BULLETS}"
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"
          echo "Handing off to fix (attempt $((N + 1))/2) for ${SHA} on PR #${PR_NUMBER}"

      - name: Post /fs-fix hand-off (machine-user)
        if: steps.decide.outputs.fire == 'true'
        env:
          GH_TOKEN: ${{ secrets.FS_AUTOFIX_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.decide.outputs.sha }}
          BULLETS: ${{ steps.decide.outputs.bullets }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          BODY_FILE=$(mktemp)
          {
            echo "/fs-fix CI is failing on this PR. Apply fixes for these findings (all fixable in this repo); leave any flake / config_env / product_bug checks alone:"
            echo ""
            printf '%s\n' "${BULLETS}"
            echo ""
            echo "Full root cause / evidence / suggested fixes: see the CI diagnosis comment (marker \`<!-- ci-diagnose -->\`) on this PR."
            echo ""
            echo "<!-- ci-diagnose-autofix: ${HEAD_SHA} -->"
          } > "${BODY_FILE}"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"
          rm -f "${BODY_FILE}"
          echo "Posted /fs-fix hand-off for ${HEAD_SHA} on PR #${PR_NUMBER}"

      - name: Post budget-exhausted note (once)
        if: steps.decide.outputs.exhausted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          {
            echo "Automated fix reached its 2-attempt limit for this PR and CI is still failing. A maintainer can take over with \`/fs-fix <instruction>\`, or stop auto-fix entirely with \`/fs-fix-stop\`."
            echo ""
            echo "<!-- ci-diagnose-autofix-exhausted -->"
          } > "${BODY_FILE}"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"
          rm -f "${BODY_FILE}"
          echo "Posted budget-exhausted note on PR #${PR_NUMBER}"
